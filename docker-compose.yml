x-trino-env: &trino-env
  TRINO_URL: ${TRINO_URL:-http://trino1:8080}
  TRINO_USER: ${TRINO_USER:-log_search}
  TRINO_PASSWORD: ${TRINO_PASSWORD:-}
  TRINO_CATALOG: ${TRINO_CATALOG:-iceberg}
  TRINO_SCHEMA: ${TRINO_SCHEMA:-logs}
  TRINO_SYSLOG_TABLE: ${TRINO_SYSLOG_TABLE:-syslog_events}
  TRINO_AUTHLOG_TABLE: ${TRINO_AUTHLOG_TABLE:-authlog_events}
  TRINO_TIMESTAMP_COLUMN: ${TRINO_TIMESTAMP_COLUMN:-ts}
  TRINO_TIMESTAMP_EXPRESSION: ${TRINO_TIMESTAMP_EXPRESSION:-}

x-trino-hosts: &trino-hosts
  - "${TRINO_HOST_ALIAS:-trino1}:${TRINO_HOST_IP:-192.168.11.18}"

services:
  access-log-init:
    image: alpine:3.21
    command: ["chmod", "0777", "/logs"]
    volumes:
      - frontend_access_logs:/logs
    restart: "no"

  access-log-api:
    build: ./access-log-api
    container_name: trino-search-access-log-api
    environment:
      ACCESS_LOG_DIR: /var/log/trino-access
      SERVICE_NAME: frontend
      CONTAINER_NAME: trino-search-frontend
      HOST_NAME: ${ACCESS_LOG_HOST:-trino-host}
    volumes:
      - frontend_access_logs:/var/log/trino-access:ro
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 3s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: trino-search-frontend
    ports:
      - "8081:80"
    volumes:
      - frontend_access_logs:/var/log/trino-access
    depends_on:
      access-log-init:
        condition: service_completed_successfully
      access-log-api:
        condition: service_healthy
      backend-python:
        condition: service_started
      backend-go:
        condition: service_started
      backend-java:
        condition: service_started
      backend-php:
        condition: service_started
      backend-ruby:
        condition: service_started
      backend-elixir:
        condition: service_started
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "{{.Name}}"
    restart: unless-stopped

  access_log_maintenance:
    image: alpine:3.20
    environment:
      ACCESS_LOG_RETENTION_DAYS: ${ACCESS_LOG_RETENTION_DAYS:-14}
    command:
      - /bin/sh
      - -c
      - retention_minutes=$$((ACCESS_LOG_RETENTION_DAYS * 1440 - 1)); while true; do find /logs -type f -name 'access-*.jsonl' -mmin +$$retention_minutes -delete; sleep 3600; done
    volumes:
      - frontend_access_logs:/logs
    restart: unless-stopped

  backend-python:
    build: ./backend-python
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-go:
    build: ./backend-go
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-java:
    build: ./backend-java
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-php:
    build: ./backend-php
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-ruby:
    build: ./backend-ruby
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-elixir:
    build: ./backend-elixir
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-contract-tests:
    build: ./backend-python
    profiles:
      - test
    depends_on:
      - backend-python
      - backend-go
      - backend-java
      - backend-php
      - backend-ruby
      - backend-elixir
    volumes:
      - ./tests:/app/tests:ro
    environment:
      BACKEND_TARGETS: python=http://backend-python:5000,go=http://backend-go:5000,java=http://backend-java:5000,php=http://backend-php:5000,ruby=http://backend-ruby:5000,elixir=http://backend-elixir:5000
      RUN_SEARCH_CONTRACT_TESTS: ${RUN_SEARCH_CONTRACT_TESTS:-0}
    command: ["pytest", "/app/tests"]

volumes:
  frontend_access_logs:
