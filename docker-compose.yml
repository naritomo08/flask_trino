x-trino-env: &trino-env
  TRINO_URL: ${TRINO_URL:-http://trino1:8080}
  TRINO_USER: ${TRINO_USER:-log_search}
  TRINO_PASSWORD: ${TRINO_PASSWORD:-}
  TRINO_CATALOG: ${TRINO_CATALOG:-iceberg}
  TRINO_SCHEMA: ${TRINO_SCHEMA:-logs}
  TRINO_SYSLOG_TABLE: ${TRINO_SYSLOG_TABLE:-syslog_events}
  TRINO_AUTHLOG_TABLE: ${TRINO_AUTHLOG_TABLE:-authlog_events}
  TRINO_TIMESTAMP_COLUMN: ${TRINO_TIMESTAMP_COLUMN:-ts}
  TRINO_TIMESTAMP_EXPRESSION: ${TRINO_TIMESTAMP_EXPRESSION:-}

x-trino-hosts: &trino-hosts
  - "${TRINO_HOST_ALIAS:-trino1}:${TRINO_HOST_IP:-192.168.11.18}"

services:
  frontend:
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend-python
      - backend-go
      - backend-java
      - backend-php
      - backend-ruby
      - backend-elixir
    logging:
      driver: syslog
      options:
        syslog-address: "tcp://127.0.0.1:514"
        tag: "nginx-access"
    restart: unless-stopped

  backend-python:
    build: ./backend-python
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-go:
    build: ./backend-go
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-java:
    build: ./backend-java
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-php:
    build: ./backend-php
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-ruby:
    build: ./backend-ruby
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-elixir:
    build: ./backend-elixir
    restart: unless-stopped
    environment:
      <<: *trino-env
    extra_hosts: *trino-hosts

  backend-contract-tests:
    build: ./backend-python
    profiles:
      - test
    depends_on:
      - backend-python
      - backend-go
      - backend-java
      - backend-php
      - backend-ruby
      - backend-elixir
    volumes:
      - ./tests:/app/tests:ro
    environment:
      BACKEND_TARGETS: flask=http://backend-python:5000,go=http://backend-go:5000,java=http://backend-java:5000,php=http://backend-php:5000,ruby=http://backend-ruby:5000,elixir=http://backend-elixir:5000
      RUN_SEARCH_CONTRACT_TESTS: ${RUN_SEARCH_CONTRACT_TESTS:-0}
    command: ["pytest", "/app/tests"]
