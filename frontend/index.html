<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Trino / Iceberg に保存されたログを検索するアプリ">
    <title>Trino Log Search</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="/" data-route>
          <span class="brand-mark">T</span>
          <span>
            <strong>Trino Log Search</strong>
            <small>Iceberg log discovery</small>
          </span>
        </a>
        <nav class="header-nav">
          <label class="backend-selector">
            <span>Backend</span>
            <select id="backend-select" aria-label="利用するバックエンド">
              <option value="elixir">Elixir</option>
              <option value="flask">Python</option>
              <option value="go">Go</option>
              <option value="java">Java</option>
              <option value="php">PHP</option>
              <option value="ruby">Ruby</option>
            </select>
          </label>
          <a class="nav-link" href="/search" data-route>ログ一覧</a>
          <a class="nav-link" href="/health" data-route>稼働状況</a>
          <a class="api-link" id="api-link" href="#" target="_blank" rel="noopener noreferrer">JSON API</a>
        </nav>
      </div>
    </header>

    <main id="app" class="container" aria-live="polite">
      <div class="loading-state">読み込み中…</div>
    </main>

    <footer class="site-footer">
      <div class="container">Trino × Iceberg log search</div>
    </footer>

    <dialog id="log-dialog" class="log-dialog">
      <div class="dialog-header">
        <div>
          <p class="eyebrow">LOG DETAIL</p>
          <h2>ログ詳細</h2>
        </div>
        <button class="dialog-close" type="button" aria-label="閉じる" data-dialog-close>×</button>
      </div>
      <div id="log-detail"></div>
    </dialog>

    <script src="/search.js"></script>
  </body>
</html>
