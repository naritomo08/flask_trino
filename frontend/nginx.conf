log_format access_json escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
    '"method":"$request_method","uri":"$request_uri","status":$status,'
    '"body_bytes_sent":$body_bytes_sent,"request_time":$request_time,'
    '"upstream_addr":"$upstream_addr","user_agent":"$http_user_agent"}';

# ヘルスダッシュボードが自動で叩く監視系リクエスト(ヘルスチェック・メトリクス・ログ自身の取得)や、
# サイトアクセス時にブラウザが自動的に取得する静的リクエスト(favicon・静的アセット等)は
# アクセスログから除外し、実際の利用者操作だけを残す。
map $request_uri $loggable_request {
    default 1;
    ~^/health 0;
    ~^/logs 0;
    ~^/favicon\.ico 0;
    ~^/robots\.txt 0;
    ~^/manifest\.json 0;
    ~^/apple-touch-icon 0;
    ~^/\.well-known/ 0;
    ~*\.(css|js|map|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot)(\?.*)?$ 0;
}

server {
    listen 80;
    server_name _;
    access_log /dev/stdout access_json if=$loggable_request;

    root /usr/share/nginx/html;
    index index.html;

    proxy_connect_timeout 2s;
    proxy_send_timeout 3s;
    proxy_read_timeout 15s;

    location ~* "\.[0-9a-f]{12}\.(css|js)$" {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
        expires -1;
        add_header Cache-Control "no-store";
    }

    location /health/flask {
        rewrite ^/health/flask$ /health break;
        proxy_pass http://backend-python:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/go {
        rewrite ^/health/go$ /health break;
        proxy_pass http://backend-go:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/java {
        rewrite ^/health/java$ /health break;
        proxy_pass http://backend-java:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/php {
        rewrite ^/health/php$ /health break;
        proxy_pass http://backend-php:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/ruby {
        rewrite ^/health/ruby$ /health break;
        proxy_pass http://backend-ruby:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /health/elixir {
        rewrite ^/health/elixir$ /health break;
        proxy_pass http://backend-elixir:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/flask/ {
        rewrite ^/api/flask/(.*)$ /api/$1 break;
        proxy_pass http://backend-python:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/go/ {
        rewrite ^/api/go/(.*)$ /api/$1 break;
        proxy_pass http://backend-go:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/java/ {
        rewrite ^/api/java/(.*)$ /api/$1 break;
        proxy_pass http://backend-java:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/php/ {
        rewrite ^/api/php/(.*)$ /api/$1 break;
        proxy_pass http://backend-php:5000;
